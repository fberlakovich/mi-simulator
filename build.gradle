plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.openrewrite.rewrite' version '6.17.0'
    id 'info.solidsoft.pitest' version '1.19.0-rc.2'
    id 'pmd'
    id 'com.github.spotbugs' version '6.0.26'
    id 'checkstyle'
}

group = 'de.unibw.mnp'
version = '1.14'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.drjekyll:fontchooser:2.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-swing-junit:3.17.1'

    // OpenRewrite dependencies
    rewrite platform('org.openrewrite.recipe:rewrite-recipe-bom:2.17.0')
    rewrite 'org.openrewrite:rewrite-java'
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis'
}

rewrite {
    activeRecipe('de.unibw.mnp.MigrateEnviromentToMachine')
}

application {
    mainClass = "gui.Main"
}

tasks.jar {
    manifest {
        attributes["Main-Class"] = "gui.Main"
    }
}

tasks.register('cli-jar', Jar) {
    manifest {
        attributes["Main-Class"] = "cli.Main"
    }
    archiveBaseName = 'mi-simulator-cli'

    // TODO: make this more specific once we have a clear separation between GUI and CLI
    from sourceSets.main.runtimeClasspath
    group = 'build'
}

test {
    useJUnit {
        // Exclude GUI tests when -PskipGuiTests is passed
        if (project.hasProperty('skipGuiTests')) {
            excludeCategories 'gui.GuiTest'
        }
    }
    finalizedBy jacocoTestReport

    // Add timeout to detect hanging tests (e.g., deadlocks)
    // Individual tests can override with @Test(timeout=...)
    systemProperty 'junit.jupiter.execution.timeout.default', '10s'

    // For JUnit 4, we need to use test timeout at the task level
    // Allow overriding via -PtestTimeout=<seconds> (default: 5 minutes, 10 minutes for GUI tests in Docker)
    def timeoutSeconds = project.hasProperty('testTimeout') ? project.property('testTimeout').toInteger() : 300
    timeout = java.time.Duration.ofSeconds(timeoutSeconds)

    // Fork a new JVM every 5 tests to avoid OOM with GUI tests (each Window creates 1MB Memory)
    // Use -PforkEveryTests=N to customize
    def forkEveryCount = project.hasProperty('forkEveryTests') ? project.property('forkEveryTests').toInteger() : 5
    forkEvery = forkEveryCount

    // Set JVM heap size for tests (increased for GUI tests with 1MB Memory per Window)
    maxHeapSize = "1g"
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, include: [
                'engine/**/*.class',
                'core/**/*.class',
                'cli/**/*.class',
                'codegenerator/**/*.class',
                'interpreter/**/*.class',
                'parser/**/*.class',
                'scanner/**/*.class'
            ])
        }))
    }
}

// Run targets
tasks.register('runGui', JavaExec) {
    description = 'Run the MI Simulator GUI'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gui.Main'
}

tasks.register('runCli', JavaExec) {
    description = 'Run the MI Simulator CLI'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cli.Main'
    standardInput = System.in
    // Pass arguments via -Pargs="program.mi -hex"
    if (project.hasProperty('args')) {
        args project.args.split('\\s+')
    }
}

// PIT Mutation Testing configuration
pitest {
    targetClasses = ['engine.**', 'cli.**']
    targetTests = ['engine.**', 'cli.**', 'core.**', 'interpreter.**']
    pitestVersion = '1.15.0'
    // Project uses JUnit 4, no junit5PluginVersion needed
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutationThreshold = 0
    coverageThreshold = 0
    // Exclude GUI-related code that's hard to test
    excludedClasses = ['gui.**']
    // Use default mutators for good coverage
    mutators = ['DEFAULTS']
    // Increase timeout for slower tests
    timeoutConstInMillis = 10000
    // Verbose output
    verbose = true
}

// =============================================================================
// Static Analysis Configuration
// =============================================================================

// PMD - Code quality and complexity analysis
pmd {
    toolVersion = '7.8.0'
    consoleOutput = true
    ignoreFailures = true  // Don't fail build, just report

    ruleSets = []  // Clear default rulesets, use custom rules
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

pmdMain {
    reports {
        xml.required = true
        html.required = true
    }
}

pmdTest {
    enabled = false  // Skip test code analysis
}

// SpotBugs - Bug detection
spotbugs {
    ignoreFailures = true
    showProgress = true
    excludeFilter = file('config/spotbugs/exclude.xml')
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = true
    }
}

spotbugsTest {
    enabled = false
}

// Checkstyle - Code style
checkstyle {
    toolVersion = '10.20.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true
    showViolations = true
    maxWarnings = 0
    maxErrors = 0
}

checkstyleMain {
    reports {
        xml.required = true
        html.required = true
    }
}

checkstyleTest {
    enabled = false
}

// Combined analysis task
tasks.register('analyze') {
    group = 'verification'
    description = 'Run all static analysis tools (PMD, SpotBugs, Checkstyle)'
    dependsOn 'pmdMain', 'spotbugsMain', 'checkstyleMain'

    doLast {
        println "\n" + "="*70
        println "STATIC ANALYSIS COMPLETE"
        println "="*70
        println "Reports generated in:"
        println "  - PMD:       build/reports/pmd/main.html"
        println "  - SpotBugs:  build/reports/spotbugs/main.html"
        println "  - Checkstyle: build/reports/checkstyle/main.html"
        println "="*70
    }
}

// Quality report summary task
tasks.register('qualityReport') {
    group = 'verification'
    description = 'Generate quality metrics summary'
    dependsOn 'analyze', 'jacocoTestReport'

    doLast {
        println "\n" + "="*70
        println "CODE QUALITY REPORT"
        println "="*70

        // Count issues from XML reports
        def pmdFile = file("build/reports/pmd/main.xml")
        def spotbugsFile = file("build/reports/spotbugs/main.xml")
        def checkstyleFile = file("build/reports/checkstyle/main.xml")

        if (pmdFile.exists()) {
            def pmdXml = new groovy.xml.XmlSlurper().parse(pmdFile)
            def pmdViolations = pmdXml.'**'.findAll { it.name() == 'violation' }.size()
            println "PMD Violations: ${pmdViolations}"
        }

        if (spotbugsFile.exists()) {
            def spotbugsXml = new groovy.xml.XmlSlurper().parse(spotbugsFile)
            def bugs = spotbugsXml.'**'.findAll { it.name() == 'BugInstance' }.size()
            println "SpotBugs Issues: ${bugs}"
        }

        if (checkstyleFile.exists()) {
            def checkstyleXml = new groovy.xml.XmlSlurper().parse(checkstyleFile)
            def errors = checkstyleXml.'**'.findAll { it.name() == 'error' }.size()
            println "Checkstyle Issues: ${errors}"
        }

        println "="*70
    }
}
